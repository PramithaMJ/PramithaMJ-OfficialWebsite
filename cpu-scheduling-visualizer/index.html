<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Scheduling Visualizer - PramithaMJ</title>
    <meta name="description" content="Interactive visualization of CPU scheduling algorithms">
    <link rel="icon" href="../favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            max-width: 600px;
        }
        
        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #ff9a9e;
            color: white;
        }
        
        .btn-secondary {
            background: transparent;
            color: #ff9a9e;
            border: 2px solid #ff9a9e;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .nav {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        
        .nav a {
            color: #333;
            text-decoration: none;
            font-weight: 500;
        }
        
        .nav a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="../">&larr; Back to Portfolio</a>
    </div>
    
    <div class="container">
        <div class="logo">⚙️</div>
        <h1>CPU Scheduling Visualizer</h1>
        <p>Interactive visualization of various CPU scheduling algorithms including FCFS, SJF, Priority, Round Robin, and more. Perfect for learning operating systems concepts.</p>
        
        <div class="buttons">
            <a href="https://pramithamj.github.io/cpu-scheduling-visualizer/" class="btn btn-primary" target="_blank">
                View Demo
            </a>
            <a href="https://github.com/PramithaMJ/cpu-scheduling-visualizer" class="btn btn-secondary" target="_blank">
                View Source
            </a>
        </div>
    </div>
    
    <script>
        // Redirect to the actual deployment after 5 seconds if user doesn't click
        setTimeout(() => {
            if (confirm('Redirect to CPU Scheduling Visualizer?')) {
                window.location.href = 'https://pramithamj.github.io/cpu-scheduling-visualizer/';
            }
        }, 5000);
    </script>
</body>
</html>
